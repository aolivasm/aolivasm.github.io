title: "Antonio Olivas-Martinez"
title_separator: "|"
email: aolivasm@upenn.edu
description: "Biostatistician and physician developing causal inference, clinical trial, and prediction methods for health research."
url: "https://aolivasm.github.io"
baseurl: ""
repository: "aolivasm/aolivasm.github.io"
locale: "en-US"
twitter_username: antonio_olivasm
github_username: aolivasm
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 10 # amount of posts to show
paginate_path: /page:num/
timezone: America/New_York

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

author:
  name   : "Antonio Olivas-Martinez"
  avatar : "/assets/images/bio-antonio.jpg"
  bio    : "Biostatistician and physician developing causal inference and prediction methods for health research."
  location: "Philadelphia, Pennsylvania"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:aolivasm@upenn.edu"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/antonio-olivas-martinez-490236198/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=ItjU968AAAAJ&hl=en"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0003-2779-0068"
    - label: "ResearchGate"
      icon: "fab fa-fw fa-researchgate"
      url: "https://www.researchgate.net/profile/Antonio-Olivas-Martinez"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/aolivasm"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/antonio-olivas-martinez-490236198/"
    - label: "ResearchGate"
      icon: "fab fa-fw fa-researchgate"
      url: "https://www.researchgate.net/profile/Antonio-Olivas-Martinez"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/aolivasm"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      published: false
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
